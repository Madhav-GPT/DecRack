[project]
name = "decrack"
version = "0.1.0"
description = "Evidence-first decision memory for coding agents: recovers decisions and rejected ideas from public discussions with a local open-weight model."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Team Allied: Madhav Gupta, Aish Sagwal, Kabir Vashisht, Akshara Verma" },
]
keywords = ["decision records", "ollama", "mcp", "pep", "knowledge recovery", "coding agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "mcp>=2.3,<3",
]

[project.scripts]
decrack = "decrack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decrack"]

[tool.hatch.build.targets.sdist]
include = ["src/decrack", "tests", "scripts", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# CI gate: syntax errors and undefined names only.
select = ["E9", "F63", "F7", "F82"]
